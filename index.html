<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management Dashboard</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .sidebar {
            height: 100vh;
            background-color: black;
            padding: 20px;
            color: white;
        }
        .sidebar a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: white ;
            font-size: x-large;
        }
        .sidebar a:hover {
            background-color: rgb(219, 103, 9);
        }
        .content {
            padding: 20px;
        }
        body{
            background-color: springgreen;
        }
        .form-group{
            font-size: x-large;
        }

    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <h4>Dashboard</h4>
                <a href="#profile">User Profile</a>
                <a href="#notifications">Notifications</a>
                <a href="#billing">Billing & Invoices</a>
                <a href="#plans">Plans & Add-ons</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 content">
                <div id="profile">
                    <h2>User Profile</h2>
                    <form>
                        <div class="form-group">
                            <label for="name">User Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter User Id">
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter password">
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>

                <div id="notifications" style="display:none;">
                    <h2>Notifications</h2>
                    <p>No new notifications.</p>
                </div>

                <div id="billing" style="display:none;">
                    <h2>Billing & Invoices</h2>
                    <p>Your billing information will be displayed here.</p>
                </div>

                <div id="plans" style="display:none;">
                    <h2>Plans & Add-ons</h2>
                    <p>Manage your plans and add-ons here.</p>
                    <form>
                        <label for="plan">Select Plan:</label>
                        <select id="plan" name="plan">
                          <option value="basic">Basic</option>
                          <option value="premium">Premium</option>
                        </select>
                        
                        <div>
                
                        <br>
                        <input type="checkbox" id="addon1" name="addons" value="extra-storage"> Extra Storage
                        <input type="checkbox" id="addon2" name="addons" value="priority-support"> Priority Support
                        </div>
                        <button type="submit">Update Plan</button>
                      </form>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.sidebar a').on('click', function(e) {
                e.preventDefault();
                var target = $(this).attr('href');
                $('.content > div').hide();
                $(target).show();
            });
        });
    </script>
</body>
</html>
